<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4F46E5">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Dayloom — kundalik rejalar, odatlar, fokus va yutuqlaringiz uchun shaxsiy makon. Offline ishlaydigan professional daily tracker.">
<meta name="referrer" content="no-referrer">
<title>Dayloom · Daily Tracker</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-XC0tR5eYHhy+ve4m9aWfWkxN+Hpn0z8DkP9dFQGyz9I='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<style>/* 01 · Wordloom design language: quiet surfaces, expressive gradients. */
:root{--bg:#F4F5FA;--surface:#fff;--text:#1A1C2C;--muted:#6B7080;--line:#E3E5EE;--primary:#4F46E5;--soft:#EFEDFF;--green:#15803D;--green-bg:#DCFCE7;--amber:#C2410C;--amber-bg:#FFEDD5;--red:#B91C1C;--red-bg:#FEE2E2;--shadow:0 3px 8px #20234c03,0 16px 35px #20234c05;--heading:Manrope,Inter,system-ui,sans-serif;--body:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141521;--surface:#1E2030;--text:#F3F3FA;--muted:#B0B3C7;--line:#37394D;--primary:#A9A3FF;--soft:#302A50;--green:#86EFAC;--green-bg:#193B2A;--amber:#FDBA74;--amber-bg:#422A1D;--red:#FCA5A5;--red-bg:#46212B;--shadow:0 8px 25px #0002}
}

:root[data-theme="dark"]{--bg:#141521;--surface:#1E2030;--text:#F3F3FA;--muted:#B0B3C7;--line:#37394D;--primary:#A9A3FF;--soft:#302A50;--green:#86EFAC;--green-bg:#193B2A;--amber:#FDBA74;--amber-bg:#422A1D;--red:#FCA5A5;--red-bg:#46212B;--shadow:0 8px 25px #0002}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;color:inherit;border:0;touch-action:manipulation}
button:disabled{opacity:.5;cursor:not-allowed}
button,a,input,select,textarea,[tabindex]{outline-offset:4px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--primary)}
button{transition:background .18s,transform .18s,box-shadow .18s}
button:active:not(:disabled){transform:translateY(1px)}
a{color:var(--primary)}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{font-family:var(--heading);font-weight:800;letter-spacing:-.035em}
h1{font-size:clamp(28px,3vw,38px);line-height:1.25}
h2{font-size:23px;line-height:1.35}
h3{font-size:17px}
h4{font-size:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.hidden,[hidden]{display:none!important}
.row{display:flex;align-items:center;gap:12px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:18px}
.grow{flex:1;min-width:0}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex-shrink:0}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 17px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:12px;font-weight:750;text-decoration:none}
.btn:hover:not(:disabled){background:var(--bg)}
.btn.primary{background:linear-gradient(115deg,#4F46E5,#7C3AED);border-color:transparent;color:#fff;box-shadow:0 5px 15px #4f46e520}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.soft{background:var(--soft);border-color:transparent;color:var(--primary)}
.btn.danger{color:var(--red);background:var(--red-bg);border-color:transparent}
.btn.square{width:44px;padding:10px;flex-shrink:0}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:99px;background:var(--bg);color:var(--muted);padding:5px 10px;font-size:10px;font-weight:700;line-height:1.5}
.pill.purple{color:var(--primary);background:var(--soft)}
.pill.green{color:var(--green);background:var(--green-bg)}
.pill.amber{color:var(--amber);background:var(--amber-bg)}
.pill.red{color:var(--red);background:var(--red-bg)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);min-width:0}
.pad{padding:24px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:17px}
.card-head p{color:var(--muted);font-size:11px;margin-top:4px}
.kbd{font:10px var(--body);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 6px;color:var(--muted);background:var(--surface)}
.skip{position:fixed;top:-80px;left:20px;z-index:100;padding:12px;background:var(--surface)}
.skip:focus{top:10px}
.divider{height:1px;background:var(--line);margin:22px 0}
.empty{padding:30px 20px;text-align:center}
.empty-icon{font-size:29px;margin-bottom:12px}
.empty h3{font-size:16px}
.empty p{font-size:12px;color:var(--muted);max-width:360px;margin:8px auto 17px}
.notice{background:var(--amber-bg);color:var(--amber);border-radius:14px;padding:13px 17px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;margin-bottom:18px}
.notice .btn{flex-shrink:0}

/* 02 · Persistent sidebar and responsive mobile navigation. */
.sidebar{position:fixed;inset:0 auto 0 0;width:226px;background:var(--surface);border-right:1px solid var(--line);padding:31px 19px 23px;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px;font:800 25px var(--heading);letter-spacing:-1.3px}
.brand-mark{width:40px;height:43px;display:grid;place-items:center;background:linear-gradient(135deg,#4F46E5,#8B51EC);color:#fff;border-radius:14px;box-shadow:0 5px 15px #4f46e522}
.brand-mark .icon{width:26px;height:26px}
.brand small{color:var(--primary)}
.brand-caption{font-size:9px;letter-spacing:.17em;color:var(--muted);margin:10px 0 30px 61px}
.nav-label-small{font-size:9px;letter-spacing:.12em;color:var(--muted);margin:0 13px 11px}
.navigation{display:grid;gap:7px}
.nav-item{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 15px;min-height:47px;width:100%;background:transparent;border-radius:12px;color:var(--muted);font-size:12px;font-weight:650}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:var(--soft);color:var(--primary)}
.nav-count{margin-left:auto;font-size:10px;background:var(--surface);padding:2px 7px;border-radius:6px}
.sidebar-bottom{margin-top:auto;display:grid;gap:14px;padding-top:25px}
.side-goal{border-radius:16px;background:var(--bg);padding:17px}
.side-goal p{font-size:10px;color:var(--muted);margin-top:7px}
.side-goal strong{font:800 12px var(--heading)}
.progress-track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.progress-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4F46E5,#986AF0);transition:width .35s ease}
.side-goal .progress-track{margin-top:13px}
.saved-line{font-size:10px;display:flex;gap:7px;align-items:center;color:var(--muted);padding:0 12px}
.saved-line .dot{color:var(--green)}
.workspace{margin-left:226px;padding:23px clamp(22px,3.8vw,58px) 42px;max-width:1680px}
.utility{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:29px}
.utility-path{font-size:11px;color:var(--muted)}
.mobile-brand{display:none}
.utility-actions{display:flex;align-items:center;gap:5px}
.utility-search{display:flex;align-items:center;gap:9px;padding:0 13px;height:44px;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:11px}
.utility-search .kbd{margin-left:auto}
.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#FCE9D5;color:#86502C;font-size:11px;font-weight:800;margin-left:5px}
.page-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}
.page-heading p{font-size:12px;color:var(--muted);margin-top:9px}
.page-heading .eyebrow{margin-bottom:8px}
.date-button{font-size:11px;color:var(--muted)}
.page-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.footer{text-align:center;font-size:10px;color:var(--muted);margin-top:28px}
.footer .icon{width:13px;height:13px}

/* 03 · Today: a useful, calm home base. */
.welcome{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:25px;padding:30px 33px;border-radius:23px;background:linear-gradient(115deg,#5146D9,#7852D9 80%,#8857DC);color:#fff;margin-bottom:22px;min-height:190px;box-shadow:0 10px 25px #4f46e510}
.welcome:before,.welcome:after{content:"";position:absolute;border:1px solid #ffffff16;width:260px;height:260px;border-radius:50%;right:-60px;top:-150px;pointer-events:none}
.welcome:after{width:350px;height:350px;top:-190px;right:-105px}
.welcome-copy{position:relative;z-index:1;max-width:550px}
.welcome .eyebrow{color:#EEE9FF;font-size:9px;margin-bottom:10px}
.welcome h2{font-size:clamp(22px,2.7vw,29px);letter-spacing:-.04em;max-width:510px;line-height:1.35}
.welcome p{font-size:11px;color:#EEE9FF;max-width:430px;margin:10px 0 17px}
.welcome .btn{background:#fff;color:#5143AB;border-color:transparent;font-size:11px;min-height:44px}
.welcome-actions{display:flex;gap:9px;align-items:center}
.welcome .btn.outline{background:#ffffff13;color:#fff;border-color:#ffffff55}
.hero-orbit{width:133px;height:133px;flex:0 0 133px;position:relative;display:grid;place-items:center;background:conic-gradient(#D9D0FF var(--angle),#ffffff26 0);border-radius:50%;margin-right:17px}
.hero-orbit:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#6D4DCF}
.hero-orbit div{position:relative;text-align:center;font-family:var(--heading);font-size:31px;font-weight:800;line-height:1.2}
.hero-orbit span{font-size:9px;font-family:var(--body);display:block;font-weight:500;color:#F0EBFF;margin-top:6px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:23px}
.metric{padding:19px 20px;border-radius:18px;box-shadow:none}
.metric-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10px;color:var(--muted)}
.metric-icon{height:31px;width:31px;display:grid;place-items:center;border-radius:10px;background:var(--soft);color:var(--primary)}
.metric-icon .icon{width:17px;height:17px}
.metric-number{font:800 27px var(--heading);letter-spacing:-.05em;margin:9px 0 3px}
.metric-number small{font:500 12px var(--body);color:var(--muted);letter-spacing:0}
.metric-caption{font-size:10px;color:var(--muted)}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start}
.dashboard-grid>.stack{gap:22px}
.segment{display:flex;gap:4px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--bg);width:max-content;max-width:100%}
.segment button{min-height:36px;padding:8px 12px;background:transparent;border-radius:7px;color:var(--muted);font-size:10px;font-weight:700}
.segment button.active{color:var(--primary);background:var(--surface);box-shadow:0 2px 5px #00000007}
.quick-form{display:flex;gap:8px;margin:17px 0 0}
.quick-form input{font-size:12px;min-width:0}
.quick-form .btn{padding:10px;width:44px;flex-shrink:0}
.plan-list{display:grid;gap:0}
.task-row{display:flex;align-items:flex-start;gap:11px;padding:16px 0;border-bottom:1px solid var(--line)}
.task-row:last-child{border-bottom:0}
.task-check{margin-top:0;width:44px;height:44px;flex-shrink:0;background:transparent;display:grid;place-items:center;border-radius:10px}
.check-box{width:22px;height:22px;border:1.5px solid #AEB3C4;border-radius:7px;display:grid;place-items:center;background:var(--surface);color:#fff;font-size:12px}
.task-check:hover .check-box{border-color:var(--primary)}
.task-row.done .check-box{background:linear-gradient(125deg,#4F46E5,#7C3AED);border-color:transparent}
.task-body{min-width:0;flex:1;padding-top:3px}
.task-title{font-size:12px;font-weight:700;overflow-wrap:anywhere;background:none;text-align:left;padding:0;line-height:1.7;min-height:24px}
.task-row.done .task-title{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:9px;color:var(--muted);margin-top:5px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:650;border-radius:6px;padding:2px 6px;background:var(--bg);color:var(--muted);max-width:100%;overflow-wrap:anywhere}
.tag .dot{width:5px;height:5px}
.priority-high{color:var(--red)}
.priority-medium{color:var(--amber)}
.priority-low{color:var(--muted)}
.task-row>.btn{padding:10px;color:var(--muted)}
.task-description{font-size:11px;color:var(--muted);margin-top:7px;overflow-wrap:anywhere}
.text-link{padding:10px 0;min-height:44px;background:none;font-size:11px;font-weight:700;color:var(--primary)}
.list-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:11px;margin-top:4px;font-size:10px;color:var(--muted)}

.habit-mini{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.habit-mini:last-child{border-bottom:0}
.habit-symbol{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;flex-shrink:0;background:var(--soft);font-size:19px}
.habit-mini h4{font:700 12px var(--body);letter-spacing:0;overflow-wrap:anywhere}
.habit-mini p{font-size:10px;color:var(--muted);margin-top:2px}
.habit-add{width:44px;height:44px;background:var(--soft);color:var(--primary);border-radius:13px;font-size:22px}
.habit-add.complete{background:var(--green-bg);color:var(--green);font-size:16px}
.week-dots{display:flex;gap:5px;margin-top:11px}
.week-dot{width:22px;height:22px;display:grid;place-items:center;border-radius:7px;background:var(--bg);color:var(--muted);font-size:8px}
.week-dot.done{background:var(--soft);color:var(--primary)}
.week-dot.current{outline:1px solid var(--primary);outline-offset:1px}
.suggestion{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);padding:11px 14px;border-radius:12px;text-align:left;width:100%;min-height:48px;font-size:12px;font-weight:600;margin-top:9px}
.suggestion .icon{margin-left:auto;color:var(--primary);width:16px}
.mood-row{display:flex;justify-content:space-between;gap:7px;margin:16px 0}
.mood-btn{min-width:44px;min-height:54px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;font-size:21px}
.mood-btn span{font-size:8px;color:var(--muted)}
.mood-btn.active{background:var(--soft);border-color:var(--primary)}
.journal-label{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:650;margin-bottom:8px}
.journal-text{min-height:86px;font-size:12px!important}
.focus-mini{background:linear-gradient(130deg,#EAE5FF,#F1EDFF);color:#4D397F;padding:24px;border-radius:20px;border:1px solid #E2DAF6;position:relative;overflow:hidden}
.focus-mini .eyebrow{color:#6A558A;font-size:9px}
.focus-mini h3{font-size:17px;margin:7px 0}
.focus-mini p{font-size:11px;max-width:250px}
.focus-mini .mini-clock{font:800 31px var(--heading);letter-spacing:-.04em;margin:18px 0}
.focus-mini .btn{font-size:11px}
.recent-entry{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.recent-entry:last-child{border:0}
.entry-dot{height:32px;width:32px;display:grid;place-items:center;border-radius:10px;background:var(--bg);color:var(--primary);flex-shrink:0}
.entry-dot .icon{width:15px;height:15px}
.recent-entry h4{font:700 12px var(--body);letter-spacing:0}
.recent-entry p{font-size:10px;color:var(--muted);margin-top:3px}
.recent-entry time{font-size:10px;color:var(--muted);margin-left:auto;white-space:nowrap}
.week-summary{display:flex;align-items:flex-end;gap:11px;height:115px;padding-top:10px}
.mini-col{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;flex:1;font-size:9px;color:var(--muted)}
.mini-bar{width:100%;max-width:35px;min-height:3px;background:linear-gradient(#A893F4,#6550D6);border-radius:6px}
.mini-col.today .mini-bar{background:linear-gradient(#6B5CEC,#4F46E5)}

/* 04 · Planner, calendars, habit cards and history. */
.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.filterbar .search-field{flex:1;min-width:180px}
.filterbar select{width:auto;max-width:200px;font-size:11px}
.search-field{position:relative}
.search-field .icon{position:absolute;left:13px;top:13px;width:18px;height:18px;color:var(--muted)}
.search-field input{padding-left:40px}
.period-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.period-bar h3{font-size:17px}
.date-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;margin-bottom:21px}
.date-tile{padding:13px 8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:83px;display:flex;flex-direction:column;align-items:center;gap:5px}
.date-tile span{color:var(--muted);font-size:10px}
.date-tile strong{font-family:var(--heading);font-size:19px}
.date-tile.active{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;border-color:transparent;box-shadow:0 5px 14px #4f46e51a}
.date-tile.active span{color:#ECE8FF}
.date-tile .date-dot{height:4px;width:4px;background:var(--primary);border-radius:50%}
.date-tile.active .date-dot{background:#fff}
.planner-day{margin-bottom:17px}
.planner-day-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.planner-day-body{padding:0 17px}
.planner-day .empty{padding:22px}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.calendar-label{font-size:10px;color:var(--muted);padding:7px;text-align:center}
.calendar-day{min-height:105px;border-radius:13px;padding:11px;background:var(--surface);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.calendar-day:hover{background:var(--bg)}
.calendar-day.today{border-color:var(--primary);background:var(--soft)}
.calendar-day.dim{opacity:.45}
.calendar-day strong{font-size:12px}
.calendar-day .cal-task{font-size:9px;border-radius:5px;background:var(--soft);color:var(--primary);padding:2px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calendar-day .cal-count{font-size:9px;color:var(--muted);margin-top:auto}
.habit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.habit-card{padding:23px}
.habit-card h3{font-size:16px;margin-top:15px;overflow-wrap:anywhere}
.habit-card .habit-quantity{font:800 30px var(--heading);letter-spacing:-.04em;margin-top:17px}
.habit-card .habit-quantity small{font:500 11px var(--body);color:var(--muted);letter-spacing:0}
.habit-card .progress-track{margin:10px 0 18px}
.habit-card .week-dots{justify-content:space-between;margin-top:18px}
.habit-card .week-dot{width:27px;height:29px;font-size:9px}
.habit-card .habit-actions{display:flex;gap:8px}
.habit-actions .btn{flex:1}
.habit-actions .btn.square{flex:0 0 44px}
.heatmap-scroll{overflow-x:auto;scrollbar-width:thin;padding:5px 3px 10px}
.heatmap-shell{min-width:820px;position:relative;padding-left:25px;padding-top:25px}
.heatmap{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px;width:max-content}

.heat-cell.current{outline:1.5px solid var(--primary);outline-offset:1px}

.history-filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:21px 0}

.pagination{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;color:var(--muted);font-size:11px}

/* 05 · Focus and analytics. */
.focus-layout{display:grid;grid-template-columns:1.35fr 1fr;gap:23px;align-items:start}

.session-row{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}

dialog{width:calc(100% - 32px);max-width:640px;max-height:90vh;max-height:90dvh;padding:0;border:1px solid var(--line);border-radius:23px;background:var(--surface);color:var(--text);box-shadow:0 24px 90px #10112640;overflow:auto}
dialog::backdrop{background:#171A365D;backdrop-filter:blur(5px)}
.dialog-head{padding:22px 25px 17px;display:flex;justify-content:space-between;align-items:center;gap:12px}

.dialog-intro{font-size:12px;color:var(--muted);margin-bottom:21px}

.setting-section{padding:25px;margin-bottom:20px}

.file-status{margin-top:18px;border-radius:13px;background:var(--bg);padding:15px;font-size:11px;overflow-wrap:anywhere}
.file-status strong{display:block;font-size:12px;margin-bottom:5px}
.category-colors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}
.category-color{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px}
.shortcuts{display:grid;gap:12px;margin-top:15px}
.shortcuts>div{display:flex;justify-content:space-between;font-size:11px}
.search-results{max-height:50vh;overflow:auto;margin-top:17px}
.search-result{display:block;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 15px;width:100%;min-height:65px;margin-bottom:8px}
.search-result strong{display:block;font-size:12px;overflow-wrap:anywhere}
.search-result span{font-size:10px;color:var(--muted)}
.search-result .pill{float:right}
.toast{position:fixed;left:calc(50% + 113px);bottom:25px;transform:translateX(-50%);background:var(--text);color:var(--surface);box-shadow:0 10px 30px #0002;z-index:80;border-radius:14px;padding:13px 17px;max-width:calc(100% - 36px);font-size:12px;display:flex;align-items:center;gap:16px}
.toast:empty{display:none}
.toast button{min-height:44px;background:transparent;border:1px solid currentColor;color:inherit;border-radius:9px;padding:8px 12px;font-size:11px;flex-shrink:0}
.timer-dock{position:fixed;right:25px;bottom:24px;padding:10px 12px 10px 17px;display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 35px #22223b18;z-index:25}
.timer-dock strong{font:800 21px var(--heading);font-variant-numeric:tabular-nums}
.timer-dock small{font-size:9px;color:var(--muted);display:block}
.motion-enter{animation:enter .3s ease}
@keyframes enter{from{opacity:0;transform:translateY(5px)}
to{opacity:1;transform:translateY(0)}
}
.pulse{animation:pulse .35s ease}
@keyframes pulse{50%{transform:scale(1.025)}
}

function nextRecurrence(task){
 let next=task.date;
 if(task.repeat==='none')return null;
 const step=()=>{if(task.repeat==='weekly')next=addDays(next,7);else if(task.repeat==='monthly'){const d=dateFrom(monthStart(addMonths(next,1)));d.setDate(Math.min(task.repeatAnchor,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));next=dateKey(d);}else{next=addDays(next,1);if(task.repeat==='weekdays')while([0,6].includes(dateFrom(next).getDay()))next=addDays(next,1);}};
 for(let i=0;i<120000;i++){step();if(next>today())return next;}return null;
}
function toggleTask(id){
 const t=findTask(id);if(!t)return;
 commit(()=>{
  t.done=!t.done;t.updatedAt=Date.now();
  if(t.done){
   t.completedAt=Date.now();
   const existing=entries().find(x=>x.entry.taskId===t.id);
   if(!existing){const e=addActivity(today(),{title:t.title,description:t.description,tag:t.tag,source:'task',taskId:t.id,duration:0});t.completedEntryId=e.id;}else t.completedEntryId=existing.entry.id;
   if(t.repeat!=='none'){
    const next=nextRecurrence(t);t.seriesId=t.seriesId||t.id;
    if(next&&!state.tasks.some(x=>x.seriesId===t.seriesId&&x.date===next)){state.tasks.push(Object.assign({},t,{id:uid(),date:next,done:false,completedAt:0,completedEntryId:'',createdAt:Date.now(),updatedAt:Date.now()}));}
   }
  }else{
   entries().filter(x=>x.entry.taskId===t.id||x.entry.id===t.completedEntryId).forEach(x=>removeActivity(x.entry.id));t.completedEntryId='';t.completedAt=0;
  }
 },t.done?'Vazifa qayta ochildi.':'Yana bir kichik g‘alaba. Vazifa bajarildi!',true);
 if(t.done)beep();
}

 const h=findHabit(id);if(!h||h.archived||!validDate(date)||date>today()||date<h.createdDate||!h.days.includes(dateFrom(date).getDay()))return;
 commit(()=>{
  const value=clamp((h.logs[date]||0)+delta,0,h.target);h.logs[date]=value;
  const match=entries().find(x=>x.date===date&&x.entry.habitId===id);
  if(value>=h.target&&!match)addActivity(date,{title:h.title,tag:h.tag,source:'habit',habitId:id,description:h.target+' '+h.unit+' bajarildi.'});
  else if(value<h.target&&match)removeActivity(match.entry.id);
 },delta>0?'Odat bo‘yicha bir qadam oldinga.':'Odat natijasi yangilandi.',true);
 if(habitDone(h,date))beep();
}

async function newLinkedFile(){
 if(!window.showSaveFilePicker){toast('Bu brauzerda parolli eksportdan foydalaning.');return;}
 try{
  cryptoReady();const handle=await window.showSaveFilePicker({suggestedName:'dayloom-private.json',types:[{description:'Parolli JSON',accept:{'application/json':['.json']}}]});
  const file=await handle.getFile();if(file.size){await readBackupFile(file,handle);return;}
  const hash=await fingerprint('');
  askPassword('Yangi fayl uchun parol',true,async(pass,isCurrent)=>{
   const result=await encryptBackup(backupSnapshot(),pass);if(!isCurrent())return;
   disconnectFile(false);link={handle,key:result.key,salt:result.salt,iterations:result.iterations,fingerprint:hash,saved:0,error:'',rotation:null};linkDirty=true;
   closeDialog();await flushLinkedSave();render();if(link&&!link.error)toast('Parolli fayl ulandi. O‘zgarishlar avtomatik yoziladi.');
  },'<p class="form-help">'+esc(handle.name)+' fayliga joriy ma’lumotlarning parolli nusxasi yoziladi.</p>');
 }catch(e){if(e.name!=='AbortError')toast(e.message||'Yangi fayl yaratilmadi.');}

function changeFilePassword(){

 const target=link;
 askPassword('Fayl parolini almashtirish',true,async(pass,isCurrent)=>{
  const salt=crypto.getRandomValues(new Uint8Array(16)),key=await deriveKey(pass,salt,NEW_ITERATIONS);if(!isCurrent()||link!==target)return;
  if(linkBusy){formError('Zaxira hozir yozilmoqda. Yozish tugagach yana bosing.');return;}
  target.rotation={key,salt,iterations:NEW_ITERATIONS};linkDirty=true;closeDialog();await flushLinkedSave();
  if(link===target&&!target.error)toast('Fayl yangi parol bilan shifrlandi.');
 });
}
/* 15 · One delegated event layer. No inline handlers or leaked globals. */
async function handleAction(button){
 const action=button.dataset.action,id=button.dataset.id,date=button.dataset.date;
 if(button.disabled)return;
 if(action!=='close-dialog')flushJournal();
 switch(action){
  case 'navigate':navigate(button.dataset.view);break;
  case 'theme':state.settings.theme=({system:'light',light:'dark',dark:'system'})[state.settings.theme];saveState();render();toast('Rang rejimi: '+({system:'tizimga mos',light:'yorug‘',dark:'tungi'})[state.settings.theme]);break;
  case 'search':openSearch();break;
  case 'new-task':openTask('',date||(view==='plans'?selectedDate:today()));break;
  case 'edit-task':openTask(id);break;
  case 'toggle-task':toggleTask(id);break;
  case 'delete-task':{const task=findTask(id);if(task)confirmDialog('Rejani o‘chirasizmi?',esc(task.title)+'<br><br>Bajarilgan ish tarixi saqlanadi. Takroriy rejaning boshqa sanalari o‘zgarmaydi.','O‘chirish',()=>commit(()=>{state.tasks=state.tasks.filter(t=>t.id!==id);entries().forEach(({entry:e})=>{if(e.taskId===id){e.taskId='';e.source='manual';}});},'Reja o‘chirildi.',true));break;}
  case 'task-filter':taskFilter=button.dataset.value;render();break;
  case 'move-overdue':moveOverdue();break;
  case 'planner-mode':plannerMode=button.dataset.mode;render();break;
  case 'planner-today':selectedDate=today();render();break;
  case 'select-date':selectedDate=date;plannerMode='day';render();break;
  case 'period':{const delta=Number(button.dataset.delta);const next=plannerMode==='month'?addMonths(selectedDate,delta):addDays(selectedDate,delta*7);if(validDate(next))selectedDate=next;render();break;}
  case 'show-plan-day':selectedDate=date;plannerMode='day';closeDialog();navigate('plans');break;
  case 'new-entry':openEntry('',date||today());break;
  case 'edit-entry':openEntry(id);break;
  case 'delete-entry':deleteEntry(id);break;
  case 'new-habit':openHabit();break;
  case 'edit-habit':openHabit(id);break;
  case 'habit-template':openHabit('',HABIT_TEMPLATES[Number(button.dataset.index)]);break;
  case 'habit-plus':updateHabit(id,1);break;
  case 'habit-minus':updateHabit(id,-1);break;
  case 'habit-log':openHabitLog(id);break;
  case 'archive-habit':{const h=findHabit(id);if(h){commit(()=>{h.archived=!h.archived;},h.archived?'Odat tiklandi.':'Odat arxivlandi. Oldingi tarix saqlanadi.',true);closeDialog();}break;}
  case 'archived-habits':archivedHabits();break;
  case 'mood':setMood(Number(button.dataset.mood));break;
  case 'year':shownYear=clamp(shownYear+Number(button.dataset.delta),1900,2200);render();break;
  case 'day-detail':openDay(date);break;
  case 'history-page':historyFilter.page+=Number(button.dataset.delta);renderHistory();break;
  case 'timer-toggle':toggleTimer();break;
  case 'timer-mode':setTimerMode(button.dataset.mode);break;
  case 'timer-finish':completeTimer(true);break;
  case 'timer-discard':if(['running','paused'].includes(state.timer.status))confirmDialog('Seansni bekor qilasizmi?','Bu seans statistikaga yozilmaydi. Ishlangan vaqtni saqlash uchun “Hozirgacha ishlangan vaqtni saqlash” tugmasini bosing.','Bekor qilish',discardTimer);else discardTimer();break;
  case 'close-dialog':flushJournal();closeDialog();importPending=null;confirmJob=null;break;
  case 'confirm':{const job=confirmJob;confirmJob=null;closeDialog();if(job)job();break;}
  case 'undo':undoLast();break;
  case 'export':exportJSON();break;
  case 'export-recovery':if(rawRecovery)downloadText(rawRecovery,'dayloom-original-recovery-'+today()+'.json');break;
  case 'import':$('import-file').value='';$('import-file').click();break;
  case 'encrypted-export':askPassword('Parolli zaxira nusxa',true,async(pass,isCurrent)=>{const result=await encryptBackup(backupSnapshot(),pass);if(!isCurrent())return;downloadText(result.text,'dayloom-private-'+today()+'.json');closeDialog();toast('Parolli zaxira tayyor. Parolni xavfsiz joyda saqlang.');});break;
  case 'file-open':await chooseLinkedFile();break;
  case 'file-new':await newLinkedFile();break;
  case 'file-save':flushJournal();if(link&&link.error){toast('Faylni uzib, qayta ulang. Qurilma nusxasi saqlangan.');break;}linkDirty=true;await flushLinkedSave();if(link&&!link.error)toast('Faylga yozildi.');break;
  case 'file-disconnect':disconnectFile();break;
  case 'file-password':changeFilePassword();break;
  case 'reload-data':confirmDialog('Yangi nusxani yuklaysizmi?','Bu sessiyadagi saqlanmagan o‘zgarishlar almashtiriladi. Kerak bo‘lsa, avval “Zaxira olish” orqali eksport qiling.','Yuklash',()=>{try{const raw=localStorage.getItem(STORE),next=raw?normalizeState(JSON.parse(raw)):defaultState();state=next;knownRaw=raw;storageConflict=false;storageIssue='';rawRecovery='';disconnectFile(false);undoRecord=null;if($('daily-note'))$('daily-note').remove();render();toast('Yangi nusxa yuklandi.');}catch(e){toast('Saqlangan nusxani o‘qib bo‘lmadi.');}});break;
  case 'persist':{let granted=false;try{granted=Boolean(navigator.storage&&navigator.storage.persist&&await navigator.storage.persist());}catch(e){}const message=granted?'Brauzer doimiy saqlashga ruxsat berdi. Zaxira olish baribir foydali.':'Bu brauzer doimiy saqlashni kafolatlamaydi. JSON zaxira olib turing.';if($('persistence-status'))$('persistence-status').textContent=message;toast(message);break;}
  case 'install':if(installPrompt){const prompt=installPrompt;installPrompt=null;await prompt.prompt();render();}break;
 }
}
document.addEventListener('click',e=>{
 const button=e.target.closest('[data-action]');if(!button)return;
 handleAction(button).catch(error=>{toast(error.message||'Amal bajarilmadi. Qayta urinib ko‘ring.');});
});
document.addEventListener('submit',async e=>{
 const form=e.target;if(!form.id)return;e.preventDefault();
 try{
  if(form.id==='task-form')saveTask(form);
  else if(form.id==='entry-form')saveEntry(form);
  else if(form.id==='habit-form')saveHabit(form);
  else if(form.id==='habit-log-form'){
   const fd=new FormData(form),h=findHabit(form.dataset.id),date=fd.get('date'),count=Number(fd.get('count'));
   if(!h||!validDate(date)||date>today()||date<h.createdDate||!h.days.includes(dateFrom(date).getDay())||!Number.isInteger(count)||count<0||count>h.target){formError('Odat rejalashtirilgan sana va to‘g‘ri miqdorni kiriting.');return;}
   updateHabit(h.id,count-(h.logs[date]||0),date);closeDialog();
  }else if(form.id==='quick-task-form'){
   flushJournal();const fd=new FormData(form),title=trim(fd.get('title'),300);if(!title)return;
   commit(()=>state.tasks.push(normalizeTask({id:uid(),title,date:today(),priority:'medium'},today())),'Reja qo‘shildi.',true);
   if($('quick-task-title'))$('quick-task-title').focus();
  }else if(form.id==='settings-form'){
   const fd=new FormData(form),values=Object.fromEntries(fd);
   commit(()=>{state.settings=normalizeState({app:'dayloom',version:2,settings:Object.assign({},state.settings,values,{sound:fd.has('sound'),reduceMotion:fd.has('reduceMotion')})}).settings;if(state.timer.status==='idle'){state.timer.duration=timerModeMinutes(state.timer.mode)*60;state.timer.remaining=state.timer.duration;}},'Sozlamalar saqlandi.');
  }else if(form.id==='password-form')await submitPassword(form);
  else if(form.id==='import-form')await applyImport(new FormData(form).get('mode'));
 }catch(error){formError(error.message||'Ma’lumotlarni tekshiring.');}
});
document.addEventListener('input',e=>{
 const target=e.target;
 if(target.id==='daily-note'){clearTimeout(journalTimer);if($('journal-status'))$('journal-status').textContent='Yozilmoqda…';journalTimer=setTimeout(flushJournal,450);}
 if(target.id==='task-search'){taskQuery=target.value;renderPlannerResults();}
 if(target.id==='global-search')searchAll(target.value);
 if(target.id==='history-search'){historyFilter.query=target.value;historyFilter.page=0;renderHistory();}

document.addEventListener('change',async e=>{
 const target=e.target;
 try{
  if(target.id==='task-category'){taskTag=target.value;renderPlannerResults();}
  if(target.id==='task-state-filter'){taskFilter=target.value;renderPlannerResults();}
  if(['history-category','history-from','history-to'].includes(target.id)){historyFilter[({'history-category':'tag','history-from':'from','history-to':'to'})[target.id]]=target.value;historyFilter.page=0;renderHistory();}
  if(target.id==='history-jump'&&validDate(target.value))openDay(target.value);
  if(target.id==='stats-month'&&validDate(target.value+'-01')){statsMonth=target.value;render();}
  if(target.id==='focus-task'&&!['running','paused'].includes(state.timer.status)){state.timer.taskId=target.value;saveState();}
  if(target.id==='habit-log-date'){const form=$('habit-log-form'),h=form&&findHabit(form.dataset.id);if(h&&$('habit-log-count'))$('habit-log-count').value=h.logs[target.value]||0;}
  if(target.dataset.colorTag!=null){Object.defineProperty(state.tagColors,target.dataset.colorTag,{value:safeColor(target.value)||COLORS[0],enumerable:true,writable:true,configurable:true});saveState();}
  if(target.id==='import-file'&&target.files&&target.files[0])await readBackupFile(target.files[0]);
 }catch(error){toast(error.message||'Faylni o‘qib bo‘lmadi.');}
});
document.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey||e.isComposing)return;
 const target=e.target;
 if(target.dataset&&target.dataset.heatIndex!=null&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key)){
  e.preventDefault();const cells=Array.from(document.querySelectorAll('[data-heat-index]')),index=cells.indexOf(target),delta=({ArrowLeft:-7,ArrowRight:7,ArrowUp:-1,ArrowDown:1})[e.key];
  let next=e.key==='Home'?cells.findIndex(x=>!x.disabled):e.key==='End'?cells.map(x=>x.disabled).lastIndexOf(false):index+delta;
  const cell=cells[next];if(cell&&!cell.disabled){target.tabIndex=-1;cell.tabIndex=0;cell.focus();}return;
 }
 if($('dialog').open||target.closest('input,textarea,select,[contenteditable="true"]'))return;
 if(e.key==='/'){e.preventDefault();openSearch();}
 else if(e.key.toLowerCase()==='n'){e.preventDefault();openTask('',view==='plans'?selectedDate:today());}
 else if(e.key.toLowerCase()==='a'){e.preventDefault();openEntry();}
 else if(e.key.toLowerCase()==='f'){e.preventDefault();navigate('focus');}
 else if(e.key===' '&&view==='focus'&&!target.closest('button,a')){e.preventDefault();toggleTimer();}
});

/* 16 · Small optional enhancements. Core functionality has no network dependency. */
function beep(){
 if(!state.settings.sound)return;
 try{
  const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
  audioContext=audioContext||new Audio();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
  const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(),at=audioContext.currentTime;
  oscillator.type='sine';oscillator.frequency.setValueAtTime(660,at);oscillator.frequency.exponentialRampToValueAtTime(880,at+.12);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.055,at+.025);gain.gain.exponentialRampToValueAtTime(.0001,at+.24);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(at);oscillator.stop(at+.25);
 }catch(e){}
}

}
